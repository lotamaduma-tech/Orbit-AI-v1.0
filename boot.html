<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Starting Orbit AI...</title>

    <link rel="stylesheet" href="css/boot.css">

</head>

<body>

<!-- =====================================
BOOT SCREEN
===================================== -->

<div id="boot-screen">

    <!-- Background Effects -->

    <div class="grid"></div>

    <div class="glow"></div>

    <!-- Main Container -->

    <div class="boot-container">

        <!-- ==========================
        LOGO
        ========================== -->

        <div class="boot-logo">

            <h1>ORBIT AI</h1>

            <p>Orbit Operating System</p>

        </div>

        <!-- ==========================
        AI CORE
        ========================== -->

        <div class="boot-core">

            <div class="boot-ring ring1"></div>

            <div class="boot-ring ring2"></div>

            <div class="boot-ring ring3"></div>

            <div class="boot-ring ring4"></div>

            <div class="scanner"></div>

            <div class="boot-center">

                <span>AI</span>

            </div>

        </div>

        <!-- ==========================
        VERSION
        ========================== -->

        <div class="version">

            Version 2.0

        </div>

        <!-- ==========================
        LOADING TEXT
        ========================== -->

        <h2 id="boot-text">

            Initializing Orbit Kernel...

        </h2>

        <!-- ==========================
        LOADING BAR
        ========================== -->

        <div class="loading-bar">

            <div id="loading-fill"></div>

        </div>

        <!-- ==========================
        DIAGNOSTICS
        ========================== -->

        <div class="diagnostics">

            <div id="status1" class="status-item">

                ○ Orbit Kernel

            </div>

            <div id="status2" class="status-item">

                ○ Neural Engine

            </div>

            <div id="status3" class="status-item">

                ○ Memory Core

            </div>

            <div id="status4" class="status-item">

                ○ Voice Recognition

            </div>

            <div id="status5" class="status-item">

                ○ Secure Connection

            </div>

            <div id="status6" class="status-item">

                ○ AI Modules

            </div>

            <div id="status7" class="status-item">

                ○ GPU Acceleration

            </div>

            <div id="status8" class="status-item">

                ○ System Diagnostics

            </div>

            <div id="status9" class="status-item">

                ○ Launch Dashboard

            </div>

        </div>

        <!-- ==========================
        STATUS
        ========================== -->

        <div class="boot-footer">

            <span id="boot-state">

                STATUS : BOOTING...

            </span>

        </div>

    </div>

</div>

<script src="js/boot.js"></script>

</body>

</html>
