<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Orbit AI account.">
    <title>Login - Orbit AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <main class="auth-page">

        <section class="auth-card" aria-label="login-title">

            <div class="auth-brand">
                <a href="index.html" class="brand" aria-label="Orbit AI home">
                    <strong>Orbit</strong>
                    <span>AI</span>
                </a>
            </div>

            <div class="auth-header">
                <h1 id="login-title">Welcome back</h1>
                <p>Sign in to continue to Orbit AI</p>
            </div>

            <form class="auth-form" id="login-form">

                <div class="auth-field">
                    <label for="login-email">Email</label>

                    <div class="auth-input">
                        <i class="fa-solid fa-envelope" aria-label="true"></i>

                        <input type="email" name="email" id="login-email" placeholder="You@example.com"
                            autocomplete="email" required>
                    </div>
                </div>

                <div class="auth-field">
                    <label for="login-password">password</label>

                    <div class="auth-input">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>

                        <input type="password" name="password" id="login-password" placeholder="Enter Your Password"
                            autocomplete="current-password" required>

                        <button type="button" class="auth-password-toggle" id="login-password-toggle"
                            aria-label="Show Password" title="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>
                </div>

                <div class="auth-options">
                    <a href="#" id="forgot-password">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" class="auth-submit" id="login-submit">

                    <span>Sign in</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <p class="auth-message" id="login-message" role="alert" aria-live="polite"></p>

            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <p class="auth-switch">
                Dont't have an account?
                <a href="signup.html">create one</a>
            </p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
